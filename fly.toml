# Fly.io config for JUTT MART
# Deploy:  fly launch --no-deploy   (once, to claim the app name)
#          fly volumes create juttmart_data --size 1 --region sin
#          fly deploy
app = "juttmart"
primary_region = "sin" # Singapore - closest Fly region to Pakistan

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  JUTTMART_DB = "/data/juttmart.db"

# Persists the SQLite database across deploys.
[mounts]
  source = "juttmart_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Powered-By = "JUTT MART"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
