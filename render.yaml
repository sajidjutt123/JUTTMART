# Render.com blueprint for JUTT MART
# Deploy: push to GitHub, then on render.com choose
# "New +" -> "Blueprint" -> pick this repo. Render reads this file.
#
# Fully-free setup (recommended): this blueprint deploys the web service and
# leaves DATABASE_URL for you to fill in. Create a free Postgres on Neon
# (permanent free tier, no credit card) and paste its connection string into
# Render -> your service -> Environment -> DATABASE_URL, then Deploy.
services:
  - type: web
    name: juttmart
    runtime: node
    plan: free
    region: singapore # closest region to Pakistan
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Where the SQLite file lives while no DATABASE_URL is set. On the free
      # plan the filesystem is ephemeral, so SQLite orders reset on redeploy.
      - key: JUTTMART_DB
        value: /var/data/juttmart.db
      # Your Neon (or Supabase) Postgres connection string goes here — set it
      # once in the Render dashboard after the first deploy. sync: false means
      # Render creates the variable but leaves the value to you.
      - key: DATABASE_URL
        sync: false
    # disk:
    #   name: juttmart-data
    #   mountPath: /var/data
    #   sizeGB: 1

# Optional: let the blueprint auto-create a Render Postgres instead. Handy for
# a quick 30-day demo, but NOT for a permanent free setup — Render deletes
# free databases after ~30-90 days unless you upgrade. For a database that
# lasts, use Neon/Supabase via DATABASE_URL above (see README).
# databases:
#   - name: juttmart-db
#     databaseName: juttmart
#     plan: free
